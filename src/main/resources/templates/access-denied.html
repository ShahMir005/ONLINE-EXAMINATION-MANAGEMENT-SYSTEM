<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: htmlhead('Access Denied')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('access-denied')}"></nav>

<main class="container" style="max-width: 640px; margin-top: 4rem; text-align: center;">
    <div class="card" style="padding: 3rem 2rem; border-color: rgba(244, 63, 94, 0.4); box-shadow: var(--shadow-lg), 0 0 35px rgba(244, 63, 94, 0.2);">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🚫</div>
        <span class="badge badge-rose" style="font-size: 0.85rem; padding: 0.35rem 0.85rem;">HTTP 403 &bull; Forbidden</span>
        <h1 class="hero-title" style="font-size: 2.2rem; margin-top: 1rem; color: var(--text-white);">Access Denied</h1>

        <p style="color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; margin: 1rem auto 2rem auto; max-width: 480px;">
            Your account <code class="feature-code-tag" th:text="${user}">username</code> does not have the required role or security permissions to access this route.
        </p>

        <div style="background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 2rem; text-align: left;">
            <div style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem;">Assigned Authorities:</div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <span th:each="r : ${roles}" class="badge badge-indigo" th:text="${r.authority}">ROLE_STUDENT</span>
            </div>
        </div>

        <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
            <a th:href="@{/}" class="btn btn-primary">Return to Home</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-secondary">Sign Out &amp; Switch Account</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
